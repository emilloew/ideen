<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ideen">
<meta name="theme-color" content="#1f7a4d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🎸%3C/text%3E%3C/svg%3E">
<title>Ideenwerkstatt</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<form id="login" hidden>
<h1>Ideen<span>werkstatt</span></h1>
<input type="text" id="em" placeholder="E-Mail" autocomplete="username" inputmode="email" autocapitalize="none">
<input type="password" id="pw" placeholder="Passwort" autocomplete="current-password" style="width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);font:inherit;color:inherit">
<div class="err" id="err"></div>
<button class="btn" type="submit">Anmelden</button>
</form>
<div id="app" hidden>
<div class="hd"><h1>Ideen<span>werkstatt</span></h1><button class="out" id="out">Abmelden</button></div>
<div class="add"><input type="text" id="q" placeholder="Neue Idee…" autocomplete="off"><button class="btn" id="go">+</button></div>
<input type="search" id="s" placeholder="Suchen (Name, Material, Tag…)" style="margin-bottom:8px">
<div class="chips" id="sf"></div>
<div id="list"></div>
<div style="margin-top:28px"><button class="chip" id="ex">Sicherung speichern</button></div>
</div>
</main>
<script type="module" src="script.js"></script>
</body>
</html>
